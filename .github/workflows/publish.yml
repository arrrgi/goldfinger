name: Publish

# Starts when release-please pushes a release tag. The checks run first, on the
# tagged commit, and the image is built only if they pass. A failed run is
# re-run from the Actions page on the same tag.

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
      security-events: write # SARIF upload
    uses: $/.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Publish image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go for the ko build
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # a publishing job never restores a cache

      # Installs ko and logs in to GHCR with the job's token; it also sets
      # KO_DOCKER_REPO to ghcr.io/<owner>/<repo>. Keep this version equal to
      # the ko pin in mise.toml.
      - name: Install ko and log in to GHCR
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      # A re-run, or a late finish, of an older release must never move latest or
      # X.Y backwards, so those two tags move only for the newest release.
      - name: Check whether this is the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          newest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [ "$newest" = "$RELEASE_TAG" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
          fi

      # With no image name the action emits bare tags: vX.Y.Z, and for the newest
      # release also X.Y and latest.
      - name: Compute the image tags from the release tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          sep-tags: ","
          flavor: latest=${{ steps.newest.outputs.is_newest }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.newest.outputs.is_newest }}

      # ko prints the pushed image reference, with its digest, on stdout.
      - name: Build and push the multi-platform image
        id: build
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          ref="$(ko build ./cmd/goldfinger \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags "$TAGS" \
            --sbom=spdx \
            --sbom-dir=sbom)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/goldfinger-index.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify both attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_REF: ${{ steps.build.outputs.ref }}
        run: |
          set -eu
          gh attestation verify "oci://${IMAGE_REF}" --repo "$REPOSITORY"
          gh attestation verify "oci://${IMAGE_REF}" --repo "$REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3
