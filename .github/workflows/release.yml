name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # open and update the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # A release created with the default GITHUB_TOKEN does not start other
  # workflows, so the checks and the publish run here, gated on its output.
  checks:
    name: Checks
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
      security-events: write # SARIF upload
    uses: $/.github/workflows/ci.yml

  # The image push and the attestations need a GitHub token, so they run only
  # here, as workflow steps, and never as mise tasks that could run locally.
  publish:
    name: Publish image
    needs: [release-please, checks]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach the SBOM to the release
      packages: write # push to GHCR
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # a publishing job never restores a cache
      # Installs ko and logs in to GHCR with the job's token; it also sets
      # KO_DOCKER_REPO to ghcr.io/<owner>/<repo>. Keep this version equal to
      # the ko pin in mise.toml.
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - name: Build and push the multi-platform image
        run: |
          set -eu
          minor="${TAG_NAME#v}"
          minor="${minor%.*}"
          ko build ./cmd/goldfinger \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags "${TAG_NAME},${minor},latest" \
            --sbom=spdx \
            --sbom-dir=sbom \
            --image-refs=image-ref.txt
      - id: image
        run: echo "digest=$(head -n 1 image-ref.txt | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom/goldfinger-index.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Verify both attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          ref="$(head -n 1 image-ref.txt)"
          gh attestation verify "oci://${ref}" --repo "$REPOSITORY"
          gh attestation verify "oci://${ref}" --repo "$REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" sbom/goldfinger-index.spdx.json --clobber
