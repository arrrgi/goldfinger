name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The publish workflow reuses these jobs, so an image is only built after the
  # same lint, test and scan jobs passed on the tagged commit.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Fallback token for when Codecov rejects the OIDC upload
        required: false

permissions: {}

concurrency:
  # github.workflow is the caller's name in a reusable call, so the publish
  # checks never replace a pending push run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Run every lint check
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Build every package
        run: mise run build

      - name: Run the tests with the race detector and write coverage
        run: mise run coverage

      # The three Codecov steps run after a failing test too, so one failure
      # never hides the other. OIDC is tried first; when Codecov rejects it and a
      # CODECOV_TOKEN secret exists, the token upload runs instead. Fork pull
      # requests have no secret, so the action uploads tokenless on its own.
      - name: Upload coverage to Codecov with OIDC
        id: codecov_oidc
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          use_oidc: true
          files: coverage.out
          fail_ci_if_error: true

      - name: Check whether a Codecov token secret exists
        id: codecov_secret
        if: ${{ !cancelled() && steps.codecov_oidc.outcome == 'failure' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload coverage to Codecov with the token
        id: codecov_token
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() && steps.codecov_secret.outputs.present == 'true' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true

      - name: Fail when no Codecov upload succeeded
        if: ${{ !cancelled() && steps.codecov_oidc.outcome == 'failure' && steps.codecov_token.outcome != 'success' }}
        run: |
          echo "::error::Codecov rejected the OIDC upload and no CODECOV_TOKEN fallback succeeded"
          exit 1

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Scan for known vulnerabilities and write SARIF
        run: mise run vuln-sarif

      - name: Audit the workflows with zizmor and write SARIF
        run: mise run zizmor-sarif

      - name: Upload the govulncheck results to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() }}
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

      - name: Upload the zizmor results to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: ${{ !cancelled() }}
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      # The SARIF run above never fails on findings; this one does.
      - name: Fail on known vulnerabilities
        run: mise run vuln
